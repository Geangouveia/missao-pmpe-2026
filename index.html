<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./brasao-pmpe.png" />
    <link rel="apple-touch-icon" href="./brasao-pmpe.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#07080a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Missão PMPE" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Missão PMPE 2026 - Preparatório Oficial Soldado (Instituto AOCP)</title>
    <meta name="description" content="Jogo de estudos completo para o concurso da PMPE (Instituto AOCP): Simulado Turbo por Blocos, Conexão Tática, Desafio da Banca e Cofre da Lei Seca." />
    <!-- Google Fonts: Outfit, Plus Jakarta Sans, Caveat & Dancing Script for Gean Signature -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Purga imediata de caches de versões antigas do PWA
      if ('caches' in window) {
        caches.keys().then((names) => {
          names.forEach((name) => {
            if (name.includes('v4') || name.includes('v3') || name.includes('v2') || name.includes('v1')) {
              caches.delete(name);
            }
          });
        });
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js?v=' + Date.now()).then((reg) => {
            reg.update();
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'activated') {
                    window.location.reload();
                  }
                });
              }
            });
          }).catch((err) => {
            console.warn('⚠️ [PWA] Falha ao registrar Service Worker:', err);
          });
        });

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
